<div class="login-page">
  <div class="login-overlay"></div>

  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">🏋️</div>
      <h1>APEX<span>FIT</span></h1>
      <p *ngIf="!recuperando">Ingreso seguro al sistema GymCRUD</p>
      <p *ngIf="recuperando">Recuperar contraseña</p>
    </div>

    <!-- INICIO DE SESIÓN -->
    <form *ngIf="!recuperando" (ngSubmit)="ingresar()" class="login-form">
      <label>Usuario</label>
      <input type="text" name="username" [(ngModel)]="username" autocomplete="username" />

      <label>Contraseña</label>
      <input type="password" name="password" [(ngModel)]="password" autocomplete="current-password" />

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>

      <div class="success" *ngIf="exito">{{ exito }}</div>
      <div class="error" *ngIf="error">{{ error }}</div>

      <a href="#" class="link" (click)="abrirRecuperacion($event)">¿Olvidaste tu contraseña?</a>
    </form>

    <!-- RECUPERAR CONTRASEÑA -->
    <form *ngIf="recuperando" (ngSubmit)="recuperar()" class="login-form">
      <small class="hint">
        Ingresa tu usuario y tu cédula registrada en el gimnasio para crear una nueva contraseña
        (disponible para clientes y entrenadores).
      </small>

      <label>Usuario</label>
      <input type="text" name="recUsername" [(ngModel)]="recUsername" autocomplete="username" />

      <label>Cédula</label>
      <input type="text" name="recCedula" [(ngModel)]="recCedula" inputmode="numeric" autocomplete="off" />

      <label>Nueva contraseña</label>
      <input type="password" name="recNueva" [(ngModel)]="recNueva" autocomplete="new-password" />

      <label>Confirmar nueva contraseña</label>
      <input type="password" name="recConfirmar" [(ngModel)]="recConfirmar" autocomplete="new-password" />

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Guardando...' : 'Restablecer contraseña' }}
      </button>

      <div class="error" *ngIf="error">{{ error }}</div>

      <a href="#" class="link" (click)="volverAlLogin($event)">← Volver a iniciar sesión</a>
    </form>
  </div>
</div>
